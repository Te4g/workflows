name: Docker Build Publish

on:
  workflow_call:
    inputs:
      image-name:
        description: "Fully-qualified image name, for example ghcr.io/te4g/my-app"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"
      image-tag:
        description: "Optional explicit Docker image tag. Defaults to sha-<git-sha>"
        required: false
        type: string
        default: ""
      target:
        description: "Optional Docker build target"
        required: false
        type: string
        default: ""
      platforms:
        description: "Target build platforms"
        required: false
        type: string
        default: "linux/amd64"
      floating-tag:
        description: "Optional floating tag, for example main or latest"
        required: false
        type: string
        default: ""
      provenance:
        description: "Enable provenance attestations"
        required: false
        type: boolean
        default: false
      sbom:
        description: "Enable SBOM attestations"
        required: false
        type: boolean
        default: false
    outputs:
      image_name:
        description: "Published image name"
        value: ${{ jobs.build.outputs.image_name }}
      image_tag:
        description: "Immutable image tag"
        value: ${{ jobs.build.outputs.image_tag }}
      image_ref:
        description: "Published immutable image reference"
        value: ${{ jobs.build.outputs.image_ref }}
      image_digest:
        description: "Published image digest"
        value: ${{ jobs.build.outputs.image_digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: meta
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          INPUT_FLOATING_TAG: ${{ inputs.floating-tag }}
        run: |
          image_name="$INPUT_IMAGE_NAME"
          image_tag="${INPUT_IMAGE_TAG:-sha-$GITHUB_SHA}"
          image_ref="$image_name:$image_tag"
          tags="$image_ref"

          if [ -n "$INPUT_FLOATING_TAG" ]; then
            tags="$tags,$image_name:$INPUT_FLOATING_TAG"
          fi

          {
            echo "image_name=$image_name"
            echo "image_tag=$image_tag"
            echo "image_ref=$image_ref"
            echo "tags=$tags"
            echo "created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ github.event.repository.name }}

      - name: Summarize published image
        env:
          FLOATING_TAG: ${{ inputs.floating-tag }}
        run: |
          {
            echo "### Published image"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.image_name }}\`"
            echo "- Immutable tag: \`${{ steps.meta.outputs.image_tag }}\`"
            if [ -n "$FLOATING_TAG" ]; then
              echo "- Floating tag: \`$FLOATING_TAG\`"
            fi
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
