name: Build release image

on:
  release:
    types:
      - published

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: Te4g/workflows/.github/workflows/docker-build-publish-ghcr.yml@main
    with:
      image-name: ghcr.io/${{ github.repository_owner }}/my-api
      image-tag: ${{ github.event.release.tag_name }}
