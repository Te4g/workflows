name: Deploy staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    permissions:
      contents: read
    uses: Te4g/workflows/.github/workflows/deploy-coolify.yml@main
    with:
      coolify-url: ${{ vars.COOLIFY_URL }}
      service-uuid: ${{ vars.COOLIFY_SERVICE_UUID_STAGING }}
      compose-file: deploy/compose.coolify.yml
      env-json: >-
        {"API_IMAGE":"ghcr.io/${{ github.repository_owner }}/my-api","API_IMAGE_TAG":"sha-${{ github.sha }}"}
    secrets:
      coolify-token: ${{ secrets.COOLIFY_TOKEN }}
